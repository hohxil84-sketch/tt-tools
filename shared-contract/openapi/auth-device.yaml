openapi: 3.1.0
info:
  title: TT Tools Auth and Device API
  description: |
    登录、刷新、退出、设备绑定 API 契约。
    包含用户认证、令牌管理和设备生命周期管理接口。
  version: 0.1.0
  contact:
    name: TT Tools Team
servers:
  - url: /api/v1
tags:
  - name: Auth
    description: 用户认证相关接口（登录、刷新、退出）
  - name: Device
    description: 设备管理相关接口（设备查询、设备绑定）
paths:
  /auth/login:
    post:
      operationId: authLogin
      summary: 登录并返回用户和设备状态
      description: 使用账号、密码和设备指纹进行登录认证，成功返回访问令牌、刷新令牌、用户信息和设备绑定状态。
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
  /auth/refresh:
    post:
      operationId: authRefresh
      summary: 刷新访问令牌
      description: 使用有效的刷新令牌换取新的访问令牌和刷新令牌对，用于维持登录会话。
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Refresh result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
  /auth/logout:
    post:
      operationId: authLogout
      summary: 退出登录
      description: 撤销指定的刷新令牌，使当前会话退出登录，对应的 access_token 和 refresh_token 均失效。
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: Logout result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
  /devices/current:
    get:
      operationId: getCurrentDevice
      summary: 获取当前设备状态
      description: 查询当前已认证设备的详细信息，包括设备指纹、名称、绑定状态和最近活跃时间。需要 Bearer Token 认证。
      tags: [Device]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current device
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentDeviceResponse'
  /devices/bind:
    post:
      operationId: bindDevice
      summary: 绑定当前设备
      description: 将当前设备与已登录用户绑定，记录设备指纹、名称和客户端版本。新设备绑定后状态为 active，重复绑定的设备返回已有记录。需要 Bearer Token 认证。
      tags: [Device]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BindDeviceRequest'
      responses:
        '200':
          description: Bind result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BindDeviceResponse'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    LoginRequest:
      type: object
      required: [account, password, device_fingerprint]
      properties:
        account:
          type: string
        password:
          type: string
          format: password
        device_fingerprint:
          type: string
        device_name:
          type: string
        client_version:
          type: string
    UserInfo:
      type: object
      required: [id, account, plan_code]
      properties:
        id:
          type: string
          format: uuid
        account:
          type: string
        display_name:
          type: string
          nullable: true
        plan_code:
          type: string
    DeviceInfo:
      type: object
      required: [id, status, is_new]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [active, blocked, removed]
        is_new:
          type: boolean
    LoginData:
      type: object
      required: [access_token, refresh_token, token_type, expires_in, user, device]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          const: bearer
        expires_in:
          type: integer
        user:
          $ref: '#/components/schemas/UserInfo'
        device:
          $ref: '#/components/schemas/DeviceInfo'
    LoginResponse:
      type: object
      required: [success, data, error, request_id]
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/LoginData'
        error:
          anyOf:
            - $ref: '#/components/schemas/ErrorDetail'
            - type: 'null'
        request_id:
          type: string
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    RefreshData:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          const: bearer
        expires_in:
          type: integer
    RefreshResponse:
      type: object
      required: [success, data, error, request_id]
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/RefreshData'
        error:
          anyOf:
            - $ref: '#/components/schemas/ErrorDetail'
            - type: 'null'
        request_id:
          type: string
    LogoutRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    LogoutResponse:
      type: object
      required: [success, data, error, request_id]
      properties:
        success:
          type: boolean
        data:
          type: object
          required: [logged_out]
          properties:
            logged_out:
              type: boolean
        error:
          anyOf:
            - $ref: '#/components/schemas/ErrorDetail'
            - type: 'null'
        request_id:
          type: string
    CurrentDevice:
      type: object
      required: [id, device_fingerprint, device_name, status]
      properties:
        id:
          type: string
          format: uuid
        device_fingerprint:
          type: string
        device_name:
          type: string
        status:
          type: string
        bound_at:
          type: string
          format: date-time
          nullable: true
        last_seen_at:
          type: string
          format: date-time
          nullable: true
    CurrentDeviceResponse:
      type: object
      required: [success, data, error, request_id]
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/CurrentDevice'
        error:
          anyOf:
            - $ref: '#/components/schemas/ErrorDetail'
            - type: 'null'
        request_id:
          type: string
    BindDeviceRequest:
      type: object
      required: [device_fingerprint]
      properties:
        device_fingerprint:
          type: string
        device_name:
          type: string
        client_version:
          type: string
    BindDeviceResponse:
      type: object
      required: [success, data, error, request_id]
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/DeviceInfo'
        error:
          anyOf:
            - $ref: '#/components/schemas/ErrorDetail'
            - type: 'null'
        request_id:
          type: string
