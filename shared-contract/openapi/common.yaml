openapi: 3.1.0
info:
  title: TT Tools Common Schemas
  version: 0.1.0
paths: {}
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    ApiResponse:
      type: object
      required: [success, data, error, request_id]
      properties:
        success:
          type: boolean
        data: {}
        error:
          anyOf:
            - $ref: '#/components/schemas/ErrorDetail'
            - type: 'null'
        request_id:
          type: string
    Pagination:
      type: object
      required: [total, limit, offset]
      properties:
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
        offset:
          type: integer
          minimum: 0
    FileRef:
      type: object
      required: [file_id, mime_type]
      properties:
        file_id:
          type: string
          format: uuid
        url:
          type: string
        mime_type:
          type: string
        width:
          type: integer
          nullable: true
        height:
          type: integer
          nullable: true
