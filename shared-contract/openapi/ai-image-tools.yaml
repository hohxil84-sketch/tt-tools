openapi: 3.1.0
info:
  title: TT Tools AI Image Tools API
  version: 0.1.0
servers:
  - url: /api/v1
security:
  - BearerAuth: []
paths:
  /ai/image-tools/tasks:
    post:
      operationId: createAiImageToolTask
      summary: 创建高级图片 AI 任务
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAiImageToolTaskRequest'
      responses:
        '200':
          description: Task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAiImageToolTaskResponse'
  /ai/image-tools/tasks/{task_id}:
    get:
      operationId: getAiImageToolTask
      summary: 查询高级图片 AI 任务
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Task status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiImageToolTaskResponse'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    CreateAiImageToolTaskRequest:
      type: object
      required: [feature, input_file_ids, client_request_id]
      properties:
        feature:
          type: string
          enum:
            - upscale_image_cloud
            - vectorize_image_cloud
            - ai_edit_image_cloud
            - remove_bg_cloud
            - ocr_cloud
        input_file_ids:
          type: array
          items:
            type: string
            format: uuid
        options:
          type: object
          additionalProperties: true
        client_request_id:
          type: string
      additionalProperties: false
    CreatedTaskData:
      type: object
      required: [task_id, status, feature, estimated_credits]
      properties:
        task_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, running, succeeded, failed]
        feature:
          type: string
        estimated_credits:
          type: integer
    CreateAiImageToolTaskResponse:
      type: object
      required: [success, data, error, request_id]
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/CreatedTaskData'
        error:
          anyOf:
            - $ref: '#/components/schemas/ErrorDetail'
            - type: 'null'
        request_id:
          type: string
    ResultFile:
      type: object
      required: [file_id, mime_type]
      properties:
        file_id:
          type: string
          format: uuid
        url:
          type: string
        mime_type:
          type: string
        width:
          type: integer
        height:
          type: integer
    AiImageToolTaskData:
      type: object
      required: [task_id, status, feature, result_files]
      properties:
        task_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, running, succeeded, failed]
        feature:
          type: string
        result_files:
          type: array
          items:
            $ref: '#/components/schemas/ResultFile'
        result_json:
          type: object
          additionalProperties: true
          nullable: true
        provider:
          type: string
        model:
          type: string
        estimated_cost:
          type: number
        credits_charged:
          type: integer
        provider_call_id:
          type: string
          format: uuid
          nullable: true
    AiImageToolTaskResponse:
      type: object
      required: [success, data, error, request_id]
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/AiImageToolTaskData'
        error:
          anyOf:
            - $ref: '#/components/schemas/ErrorDetail'
            - type: 'null'
        request_id:
          type: string
