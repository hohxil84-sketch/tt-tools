openapi: 3.1.0
info:
  title: TT Tools Credits and Billing API
  version: 0.1.0
servers:
  - url: /api/v1
security:
  - BearerAuth: []
paths:
  /credits/balance:
    get:
      operationId: getCreditBalance
      summary: 查询当前用户 AI 额度余额
      responses:
        '200':
          description: Credit balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditBalanceResponse'
  /credits/ledger:
    get:
      operationId: listCreditLedger
      summary: 查询当前用户 AI 额度流水
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: change_type
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Credit ledger
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditLedgerResponse'
  /entitlements/check:
    post:
      operationId: checkEntitlement
      summary: 检查本地付费功能套餐权限
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntitlementCheckRequest'
      responses:
        '200':
          description: Entitlement check
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitlementCheckResponse'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    CreditBalance:
      type: object
      required: [user_id, plan_code, monthly_grant, balance, status, updated_at]
      properties:
        user_id:
          type: string
          format: uuid
        plan_code:
          type: string
        monthly_grant:
          type: integer
        balance:
          type: integer
        period_start:
          type: string
          format: date-time
          nullable: true
        period_end:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
        updated_at:
          type: string
          format: date-time
    CreditBalanceResponse:
      type: object
      required: [success, data, error, request_id]
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/CreditBalance'
        error:
          anyOf:
            - $ref: '#/components/schemas/ErrorDetail'
            - type: 'null'
        request_id:
          type: string
    CreditLedgerItem:
      type: object
      required: [id, change_type, amount, balance_after, source_type, created_at]
      properties:
        id:
          type: string
          format: uuid
        change_type:
          type: string
          enum: [grant, consume, recharge, refund, adjust]
        amount:
          type: integer
        balance_after:
          type: integer
        source_type:
          type: string
        source_id:
          type: string
          format: uuid
          nullable: true
        description:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
    CreditLedgerData:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CreditLedgerItem'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    CreditLedgerResponse:
      type: object
      required: [success, data, error, request_id]
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/CreditLedgerData'
        error:
          anyOf:
            - $ref: '#/components/schemas/ErrorDetail'
            - type: 'null'
        request_id:
          type: string
    EntitlementCheckRequest:
      type: object
      required: [feature, operation, client_request_id]
      properties:
        feature:
          type: string
        operation:
          type: string
        client_request_id:
          type: string
    EntitlementCheckData:
      type: object
      required: [allowed, feature, plan_code]
      properties:
        allowed:
          type: boolean
        feature:
          type: string
        plan_code:
          type: string
        remaining_free_quota:
          type: integer
          nullable: true
        reason:
          type: string
          nullable: true
    EntitlementCheckResponse:
      type: object
      required: [success, data, error, request_id]
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/EntitlementCheckData'
        error:
          anyOf:
            - $ref: '#/components/schemas/ErrorDetail'
            - type: 'null'
        request_id:
          type: string
