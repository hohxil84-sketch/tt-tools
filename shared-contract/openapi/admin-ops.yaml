openapi: "3.1.0"

info:
  title: TT Tools Admin Ops
  description: 后台运维管理 — 调用记录、成本统计、风控日志、功能开关。
  version: "0.1.0"

servers:
  - url: http://127.0.0.1:8000/api/v1
    description: 本地开发服务器

# 全局安全方案引用 common.yaml 的 BearerAuth
security:
  - BearerAuth: []

paths:
  # ============================================================
  # Provider 调用日志（管理员跨用户视图）
  # ============================================================

  /admin/provider-call-logs:
    get:
      tags: [Admin Ops]
      summary: 查询全部 Provider 调用日志
      description: |
        返回系统中所有用户的 Provider 调用日志，支持分页和多条件筛选。
        与普通用户 /provider-call-logs 的区别：管理员可查看所有用户日志，
        支持按 user_id 筛选。不返回 raw_usage_json、raw_meta_json、完整 prompt、
        API Key 等隐私内容。需要管理员权限。
      operationId: listAllProviderCallLogs
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          description: 每页条数（默认 20，最大 100）
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          description: 偏移量（默认 0）
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: user_id
          in: query
          description: 按用户 ID 筛选
          schema:
            type: string
            format: uuid
        - name: feature
          in: query
          description: 按功能码筛选
          schema:
            type: string
        - name: provider
          in: query
          description: 按 Provider 名称筛选
          schema:
            type: string
        - name: status
          in: query
          description: 按调用状态筛选
          schema:
            type: string
            enum: [success, failed, timeout]
      responses:
        "200":
          description: 调用日志列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AdminProviderCallLogListData"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"

  /admin/provider-call-logs/{log_id}:
    get:
      tags: [Admin Ops]
      summary: 查询 Provider 调用日志详情
      description: |
        根据日志 ID 返回单条 Provider 调用记录的详细信息（含用户账号）。
        不返回 raw_usage_json、raw_meta_json 等仅服务端使用的字段。
        需要管理员权限。
      operationId: getProviderCallLogDetail
      security:
        - BearerAuth: []
      parameters:
        - name: log_id
          in: path
          required: true
          description: 调用日志 ID（UUID）
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 调用日志详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AdminProviderCallLogDetail"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  # ============================================================
  # 成本统计
  # ============================================================

  /admin/cost-stats:
    get:
      tags: [Admin Ops]
      summary: 查询成本/用量聚合统计
      description: |
        返回 Provider 调用的聚合统计数据：总调用次数、总 token 用量、
        总估算成本、总扣除额度，以及按功能码和 Provider 的细分统计。
        需要管理员权限。
      operationId: getCostStats
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 成本统计数据
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CostStatsData"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"

  # ============================================================
  # 风控日志
  # ============================================================

  /admin/risk-logs:
    get:
      tags: [Admin Ops]
      summary: 查询风控日志列表
      description: |
        返回系统中的风控日志列表，支持分页和多条件筛选。
        需要管理员权限。
      operationId: listRiskLogs
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          description: 每页条数（默认 20，最大 100）
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          description: 偏移量（默认 0）
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: user_id
          in: query
          description: 按用户 ID 筛选
          schema:
            type: string
            format: uuid
        - name: risk_type
          in: query
          description: 按风险类型筛选
          schema:
            type: string
        - name: severity
          in: query
          description: 按严重程度筛选
          schema:
            type: string
            enum: [low, medium, high]
      responses:
        "200":
          description: 风控日志列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/RiskLogListData"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"

  /admin/risk-logs/{log_id}:
    get:
      tags: [Admin Ops]
      summary: 查询风控日志详情
      description: |
        根据日志 ID 返回单条风控日志的详细信息（含关联用户账号）。
        需要管理员权限。
      operationId: getRiskLogDetail
      security:
        - BearerAuth: []
      parameters:
        - name: log_id
          in: path
          required: true
          description: 风控日志 ID（UUID）
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 风控日志详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/RiskLogDetail"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  # ============================================================
  # 功能开关
  # ============================================================

  /admin/feature-flags:
    get:
      tags: [Admin Ops]
      summary: 查询功能开关配置
      description: |
        返回各套餐的功能开关配置。可按 plan_code 筛选指定套餐。
        需要管理员权限。
      operationId: getFeatureFlags
      security:
        - BearerAuth: []
      parameters:
        - name: plan_code
          in: query
          description: 按套餐编码筛选（可选，不传返回所有套餐）
          schema:
            type: string
      responses:
        "200":
          description: 功能开关配置列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/FeatureFlagsListData"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"

  /admin/plans/{plan_id}/features:
    patch:
      tags: [Admin Ops]
      summary: 更新套餐功能开关
      description: |
        更新指定套餐的功能开关配置（合并更新，只更新传入的 key）。
        需要管理员权限。
      operationId: updatePlanFeatures
      security:
        - BearerAuth: []
      parameters:
        - name: plan_id
          in: path
          required: true
          description: 套餐 ID（UUID）
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFeatureFlagsRequest"
      responses:
        "200":
          description: 更新后的功能开关配置
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PlanFeatureFlagsItem"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

components:
  schemas:
    # ============================================================
    # Provider 调用日志 DTO（管理员视图）
    # ============================================================

    AdminProviderCallLogItem:
      type: object
      description: 管理员 Provider 调用日志列表项（含用户账号）
      properties:
        id:
          type: string
          format: uuid
          description: 调用日志 ID
        request_id:
          type: string
          description: 请求追踪 ID
        user_id:
          type: string
          format: uuid
          description: 用户 ID
        user_account:
          type: string
          nullable: true
          description: 用户账号
        feature:
          type: string
          description: 功能码
        feature_name:
          type: string
          nullable: true
          description: 功能中文名（从 feature_codes 表关联查询）
        provider:
          type: string
          description: Provider 名称
        model:
          type: string
          description: 模型名称
        status:
          type: string
          description: 调用状态
        error_code:
          type: string
          nullable: true
          description: 错误码
        input_tokens:
          type: integer
          description: 输入 token 数
        output_tokens:
          type: integer
          description: 输出 token 数
        total_tokens:
          type: integer
          description: 总 token 数
        estimated_cost:
          type: number
          description: 估算成本（人民币）
        credits_charged:
          type: integer
          description: 扣除额度
        latency_ms:
          type: integer
          nullable: true
          description: 调用延迟（毫秒）
        created_at:
          type: string
          format: date-time
          description: 调用时间
      required:
        - id
        - request_id
        - user_id
        - feature
        - provider
        - model
        - status
        - input_tokens
        - output_tokens
        - total_tokens
        - estimated_cost
        - credits_charged
        - created_at

    AdminProviderCallLogDetail:
      type: object
      description: 管理员 Provider 调用日志详情（含用户账号和展示名称）
      properties:
        id:
          type: string
          format: uuid
          description: 调用日志 ID
        request_id:
          type: string
          description: 请求追踪 ID
        user_id:
          type: string
          format: uuid
          description: 用户 ID
        user_account:
          type: string
          nullable: true
          description: 用户账号
        user_display_name:
          type: string
          nullable: true
          description: 用户展示名称
        feature:
          type: string
          description: 功能码
        feature_name:
          type: string
          nullable: true
          description: 功能中文名（从 feature_codes 表关联查询）
        provider:
          type: string
          description: Provider 名称
        model:
          type: string
          description: 模型名称
        status:
          type: string
          description: 调用状态
        error_code:
          type: string
          nullable: true
          description: 错误码
        input_tokens:
          type: integer
          description: 输入 token 数
        output_tokens:
          type: integer
          description: 输出 token 数
        total_tokens:
          type: integer
          description: 总 token 数
        estimated_cost:
          type: number
          description: 估算成本（人民币）
        credits_charged:
          type: integer
          description: 扣除额度
        latency_ms:
          type: integer
          nullable: true
          description: 调用延迟（毫秒）
        created_at:
          type: string
          format: date-time
          description: 调用时间
      required:
        - id
        - request_id
        - user_id
        - feature
        - provider
        - model
        - status
        - input_tokens
        - output_tokens
        - total_tokens
        - estimated_cost
        - credits_charged
        - created_at

    AdminProviderCallLogListData:
      type: object
      description: 管理员 Provider 调用日志列表分页响应数据
      properties:
        items:
          type: array
          description: 调用日志列表
          items:
            $ref: "#/components/schemas/AdminProviderCallLogItem"
        total:
          type: integer
          description: 总记录数
        limit:
          type: integer
          description: 每页条数
        offset:
          type: integer
          description: 当前偏移量
      required:
        - items
        - total
        - limit
        - offset

    # ============================================================
    # 成本统计 DTO
    # ============================================================

    CostBreakdownItem:
      type: object
      description: 按维度的成本细分统计
      properties:
        key:
          type: string
          description: 维度值（如功能码 ai_copy_cloud 或 Provider 名称 deepseek）
        key_name:
          type: string
          nullable: true
          description: 维度值中文名（仅 by_feature 时有值，从 feature_codes 表关联查询）
        calls:
          type: integer
          description: 调用次数
        total_tokens:
          type: integer
          description: 总 token 数
        total_cost:
          type: number
          description: 总估算成本
        total_credits:
          type: integer
          description: 总扣除额度
      required:
        - key
        - calls
        - total_tokens
        - total_cost
        - total_credits

    CostStatsData:
      type: object
      description: 成本/用量聚合统计数据
      properties:
        total_calls:
          type: integer
          description: 总 Provider 调用次数
        total_tokens:
          type: integer
          description: 总 token 用量
        total_cost:
          type: number
          description: 总估算成本（人民币）
        total_credits_charged:
          type: integer
          description: 总扣除 AI 额度
        by_feature:
          type: array
          description: 按功能码细分统计
          items:
            $ref: "#/components/schemas/CostBreakdownItem"
        by_provider:
          type: array
          description: 按 Provider 细分统计
          items:
            $ref: "#/components/schemas/CostBreakdownItem"
      required:
        - total_calls
        - total_tokens
        - total_cost
        - total_credits_charged
        - by_feature
        - by_provider

    # ============================================================
    # 风控日志 DTO
    # ============================================================

    RiskLogItem:
      type: object
      description: 风控日志列表项
      properties:
        id:
          type: string
          format: uuid
          description: 风控日志 ID
        user_id:
          type: string
          format: uuid
          nullable: true
          description: 用户 ID
        user_account:
          type: string
          nullable: true
          description: 用户账号
        device_id:
          type: string
          format: uuid
          nullable: true
          description: 设备 ID
        device_name:
          type: string
          nullable: true
          description: 设备名称（从 devices 表关联查询）
        risk_type:
          type: string
          description: 风险类型
        severity:
          type: string
          description: 严重程度（low / medium / high）
        created_at:
          type: string
          format: date-time
          description: 记录时间
      required:
        - id
        - risk_type
        - severity
        - created_at

    RiskLogDetail:
      type: object
      description: 风控日志详情
      properties:
        id:
          type: string
          format: uuid
          description: 风控日志 ID
        user_id:
          type: string
          format: uuid
          nullable: true
          description: 用户 ID
        user_account:
          type: string
          nullable: true
          description: 用户账号
        user_display_name:
          type: string
          nullable: true
          description: 用户展示名称
        device_id:
          type: string
          format: uuid
          nullable: true
          description: 设备 ID
        device_name:
          type: string
          nullable: true
          description: 设备名称（从 devices 表关联查询）
        risk_type:
          type: string
          description: 风险类型
        severity:
          type: string
          description: 严重程度
        details_json:
          type: object
          description: 脱敏详情
        created_at:
          type: string
          format: date-time
          description: 记录时间
      required:
        - id
        - risk_type
        - severity
        - details_json
        - created_at

    RiskLogListData:
      type: object
      description: 风控日志列表分页响应数据
      properties:
        items:
          type: array
          description: 风控日志列表
          items:
            $ref: "#/components/schemas/RiskLogItem"
        total:
          type: integer
          description: 总记录数
        limit:
          type: integer
          description: 每页条数
        offset:
          type: integer
          description: 当前偏移量
      required:
        - items
        - total
        - limit
        - offset

    # ============================================================
    # 功能开关 DTO
    # ============================================================

    PlanFeatureFlagsItem:
      type: object
      description: 套餐功能开关配置项
      properties:
        plan_id:
          type: string
          format: uuid
          description: 套餐 ID
        plan_code:
          type: string
          description: 套餐编码
        plan_name:
          type: string
          description: 套餐名称
        enabled_features_json:
          type: object
          description: 功能开关配置
        plan_status:
          type: string
          description: 套餐状态
      required:
        - plan_id
        - plan_code
        - plan_name
        - enabled_features_json
        - plan_status

    FeatureFlagsListData:
      type: object
      description: 功能开关配置列表响应数据
      properties:
        items:
          type: array
          description: 各套餐功能开关配置列表
          items:
            $ref: "#/components/schemas/PlanFeatureFlagsItem"
      required:
        - items

    UpdateFeatureFlagsRequest:
      type: object
      description: 更新功能开关请求（合并更新）
      properties:
        enabled_features_json:
          type: object
          description: 功能开关配置（合并到现有配置，只更新传入的 key）
      required:
        - enabled_features_json
