openapi: 3.1.0
info:
  title: TT Tools AI Render API
  version: 0.1.0
servers:
  - url: /api/v1
security:
  - BearerAuth: []
paths:
  /ai/render/tasks:
    post:
      operationId: createAiRenderTask
      summary: 创建效果图生成任务
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAiRenderTaskRequest'
      responses:
        '200':
          description: Task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAiRenderTaskResponse'
  /ai/render/tasks/{task_id}:
    get:
      operationId: getAiRenderTask
      summary: 查询效果图生成任务
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Task status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiRenderTaskResponse'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    CreateAiRenderTaskRequest:
      type: object
      required: [scene_type, prompt, input_file_ids, client_request_id]
      properties:
        scene_type:
          type: string
        prompt:
          type: string
        input_file_ids:
          type: array
          items:
            type: string
            format: uuid
        style:
          type: string
        size:
          type: string
        client_request_id:
          type: string
      additionalProperties: false
    CreatedTaskData:
      type: object
      required: [task_id, status, feature, estimated_credits]
      properties:
        task_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, running, succeeded, failed]
        feature:
          type: string
          const: ai_render_cloud
        estimated_credits:
          type: integer
    CreateAiRenderTaskResponse:
      type: object
      required: [success, data, error, request_id]
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/CreatedTaskData'
        error:
          anyOf:
            - $ref: '#/components/schemas/ErrorDetail'
            - type: 'null'
        request_id:
          type: string
    ResultFile:
      type: object
      required: [file_id, mime_type]
      properties:
        file_id:
          type: string
          format: uuid
        url:
          type: string
        mime_type:
          type: string
        width:
          type: integer
        height:
          type: integer
    AiRenderTaskData:
      type: object
      required: [task_id, status, result_files]
      properties:
        task_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, running, succeeded, failed]
        result_files:
          type: array
          items:
            $ref: '#/components/schemas/ResultFile'
        provider:
          type: string
        model:
          type: string
        estimated_cost:
          type: number
        credits_charged:
          type: integer
        provider_call_id:
          type: string
          format: uuid
          nullable: true
    AiRenderTaskResponse:
      type: object
      required: [success, data, error, request_id]
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/AiRenderTaskData'
        error:
          anyOf:
            - $ref: '#/components/schemas/ErrorDetail'
            - type: 'null'
        request_id:
          type: string
